name: Build Filos IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Jailed IPA
        run: chmod +x ipabuild.sh && ./ipabuild.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Filos-IPA
          path: "**/*.ipa"
